<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Запускайте Rust Signal прямо в браузере: выбирайте Искру или Грома и проходите шесть миссий кампании." />
    <title>Rust Signal — играть онлайн в браузере</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; --target-size: 28px; }
      @media (pointer: coarse) { :root { --target-size: 44px; } }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        background: radial-gradient(circle at 50% 35%, #121c2c 0%, #070b14 78%);
        color: #e2eced;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: relative;
        display: flex;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        align-items: center;
        justify-content: center;
        overflow: hidden;
        isolation: isolate;
      }
      #app canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        box-shadow: 0 0 0 1px rgba(132, 168, 196, .18), 0 18px 56px rgba(0, 0, 0, .78);
      }
      #site-loading {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(circle at 50% 42%, #131b2b 0%, #070b14 75%);
        text-align: center;
      }
      #site-loading strong {
        letter-spacing: .16em;
        font: 800 clamp(1.35rem, 1rem + 2.5vw, 2.5rem)/1.15 monospace;
        color: #ffca82;
        text-shadow: 0 2px 0 #3a180c, 0 0 18px rgba(255, 168, 72, .25);
      }
      #site-loading span { font: clamp(0.8rem, 0.7rem + 0.5vw, 0.95rem)/1.5 monospace; color: #a5b7c3; }
      #site-loading .bar {
        height: 4px; width: min(260px, 68vw);
        background: linear-gradient(90deg, #3fc9cc, #f4ba74, #3fc9cc);
        background-size: 200% 100%;
        animation: scan 1.6s linear infinite;
      }
      @keyframes scan { to { background-position: 200% 0; } }
      @media (prefers-reduced-motion: reduce) { #site-loading .bar { animation: none; } }
      .back-site {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        top: max(10px, env(safe-area-inset-top));
        z-index: 30;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-block-size: var(--target-size);
        min-inline-size: var(--target-size);
        background: rgba(14, 21, 32, .88);
        border: 1px solid #987452;
        color: #ffc88e;
        font: 700 11px/1 monospace;
        padding: 6px 10px;
        text-decoration: none;
        opacity: .82;
        transition: opacity .15s, border-color .15s;
      }
      .back-site:hover, .back-site:focus-visible { opacity: 1; border-color: #ffca82; outline: 2px solid #59d5e0; outline-offset: 2px; }
    </style>
  <meta name="application-name" content="Rust Signal"><meta property="og:site_name" content="Rust Signal"><meta property="og:type" content="website"><meta property="og:title" content="Rust Signal — играть онлайн в браузере"><meta property="og:description" content="Запускайте Rust Signal прямо в браузере: выбирайте Искру или Грома и проходите шесть миссий кампании."><meta property="og:image" content="/logo.svg"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Rust Signal","alternateName":"Ржавый сигнал","applicationCategory":"Game","operatingSystem":"Web Browser","inLanguage":"ru","description":"Запускайте Rust Signal прямо в браузере: выбирайте Искру или Грома и проходите шесть миссий кампании.","image":"/logo.svg"}</script></head>
  <body>
    <a href="/" class="back-site" aria-label="Вернуться на главную страницу сайта">На сайт ↗</a>
    <main id="app" aria-label="Игра «Ржавый сигнал»">
      <div id="site-loading" role="status" aria-live="polite">
        <strong>РЖАВЫЙ СИГНАЛ</strong>
        <span>Загружаем сцену…</span>
        <div class="bar" aria-hidden="true"></div>
      </div>
    </main>
    <noscript>Для запуска включите JavaScript в настройках браузера.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
